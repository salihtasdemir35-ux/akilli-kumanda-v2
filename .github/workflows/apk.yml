name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip'i aç
        run: |
          ZIP="$(ls *.zip | head -1)"
          echo "Açılan dosya: $ZIP"
          unzip -o "$ZIP"
          ls -la AkilliKumandaMerkezi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        working-directory: AkilliKumandaMerkezi
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Debug APK
        working-directory: AkilliKumandaMerkezi
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AkilliKumandaMerkezi-debug-apk
          path: AkilliKumandaMerkezi/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-raporu
          path: AkilliKumandaMerkezi/app/build/reports/tests/
